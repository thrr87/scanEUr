id: sentry
name: Sentry
category: observability
secondary_categories:
  - error_tracking
  - performance_monitoring
aliases:
  - Sentry SDK
website: "https://sentry.io"
identifiers:
  domains:
    - sentry.io
    - o0.ingest.sentry.io
  packages:
    npm:
      - '@sentry/browser'
      - '@sentry/node'
      - '@sentry/react'
      - '@sentry/nextjs'
    pypi:
      - sentry-sdk
    other: []
  env_patterns:
    - '^SENTRY_'
  docker_images:
    - getsentry/sentry
  github_actions: []
  config_files:
    - sentry.properties
    - .sentryclirc
  terraform_providers: []
jurisdiction:
  headquarters_country: unknown_review_required
  headquarters_region: Unknown
  eu_establishment: unknown
  data_residency_options: []
  jurisdiction_notes: "Jurisdiction and data residency options require current vendor documentation and human review."
ownership_control:
  control_region: Unknown
  parent_company: unknown
  publicly_traded: unknown
  control_notes: "Ownership/control is not asserted by this draft."
data_categories:
  likely_personal_data: medium
  common_data_types:
    - logs
    - error traces
    - IP address
    - user identifiers
    - stack traces
  sensitive_data_possible: true
  data_notes: "Stack traces and breadcrumbs can include personal or secret data if not scrubbed."
common_use_cases:
  - error tracking
  - performance monitoring
  - release health
operational_criticality_default: medium
migration_effort_default: medium
scoring_defaults:
  jurisdiction_signal: medium
  data_sensitivity_signal: medium
  operational_criticality: medium
  migration_effort: medium
  alternative_maturity: medium
  evidence_confidence: high
recommendation_defaults:
  categories:
    - configure_better
    - review_contractually
    - monitor
  notes: "Review data scrubbing, PII filters, retention, and source map handling."
evidence_sources:
  - title: Sentry documentation
    url: "https://docs.sentry.io"
    source_type: documentation
    supports:
      - vendor identity
      - SDK identifiers
    retrieved_at: unknown
  - title: Sentry JavaScript SDK package
    url: "https://www.npmjs.com/package/@sentry/browser"
    source_type: registry
    supports:
      - npm package identifier
    retrieved_at: unknown
verification:
  status: agent_draft
  last_reviewed: unknown
  reviewed_by: unknown
  review_notes: "Initial seed profile. Jurisdiction and ownership/control fields require human review before verification."
limitations:
  - "SDK presence does not prove production telemetry is enabled."
  - "Observed telemetry sensitivity depends heavily on scrubbing and payload configuration."
notes: "Error tracking findings should prompt payload and retention review."
schema_version: "0.1"
