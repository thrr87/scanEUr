fingerprints:
  - id: fingerprint_env_stripe_prefix
    verification_status: agent_draft
    rule_type: env_var
    match:
      pattern: '^STRIPE_'
      case_sensitive: false
    result:
      vendor_id: stripe
      candidate_category: payments
      confidence: high
      evidence_label: Stripe environment variable prefix
      observed_fact: "A STRIPE_ environment variable was found."
      inference: "The project may be configured for Stripe."
      manual_review_recommended: true
    limitations:
      - "Environment variables can be unused, stale, or development-only."
    schema_version: "0.1"
