name: Feature request
description: Propose scanner, CLI, reporting, documentation, or methodology improvements.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This keeps default behavior local-first and offline-by-default.
          required: true
        - label: This does not add telemetry, source-code upload, affiliate links, paid placement, or sponsored recommendations.
          required: true
        - label: This avoids legal overclaiming and supports manual review for high-impact decisions.
          required: true
